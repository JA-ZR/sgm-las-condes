<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SGM Las Condes · Estados</title><style>body{font-family:system-ui,-apple-system,Segoe UI,sans-serif;margin:0;background:#f3f6fa;color:#17243a}.wrap{max-width:680px;margin:auto;padding:18px}header{background:#12365b;color:white;padding:24px 18px}h1{font-size:22px;margin:0}small{color:#c9daed}.panel{background:white;padding:16px;border-radius:14px;margin-top:16px;box-shadow:0 2px 12px #122b4812}.row{display:flex;gap:8px;flex-wrap:wrap}button{border:1px solid #d2dae5;border-radius:10px;padding:13px 15px;background:#f8fafc;font-size:15px;font-weight:650;cursor:pointer;flex:1}button.active{background:#14518d;color:white;border-color:#14518d}input,select{width:100%;box-sizing:border-box;padding:13px;border:1px solid #cbd5e1;border-radius:10px;font-size:16px}.item{padding:13px;border-bottom:1px solid #e8edf4;display:flex;justify-content:space-between;gap:10px}.item:last-child{border:0}.tag{font-size:12px;font-weight:700;color:#137342}.pending{color:#aa6500}.muted{color:#66758a;font-size:13px}#msg{padding:12px;color:#a54b15}h2{font-size:17px}</style></head><body><header><div class="wrap" style="padding:0"><h1>SGM · Las Condes</h1><small>Consulta de mantenciones · Solo lectura</small></div></header><main class="wrap"><div class="panel"><label for="mes"><strong>Seleccionar mes</strong></label><select id="mes"></select><p class="muted" id="updated"></p><div class="row"><button id="pendiente" class="active">Pendientes</button><button id="realizado">Realizados</button></div></div><div class="panel"><h2>Tipo de punto</h2><div class="row" id="types"></div><p><input id="search" placeholder="Buscar PI02, RI34, nombre..." autocomplete="off"></p><h2 id="heading"></h2><div id="list"></div></div><p id="msg"></p></main><script>let data,estado='pendiente',tipo='PI';const $=id=>document.getElementById(id),types=['PI','RI','RM','ZW','NODO'];function render(){if(!data)return;const mes=$('mes').value,all=data.puntos[mes]||[],items=all.filter(p=>p.tipo===tipo&&p.estado===estado&&p.codigo.toLocaleLowerCase().includes($('search').value.trim().toLocaleLowerCase()));$('types').innerHTML='';for(const t of types){const b=document.createElement('button');b.textContent=t+' ('+all.filter(p=>p.tipo===t&&p.estado===estado).length+')';b.className=t===tipo?'active':'';b.onclick=()=>{tipo=t;render()};$('types').append(b)}$('heading').textContent=tipo+' · '+(estado==='pendiente'?'Pendientes':'Realizados')+' ('+items.length+')';$('list').replaceChildren();if(!items.length){const p=document.createElement('p');p.className='muted';p.textContent='No hay puntos para mostrar.';$('list').append(p)}for(const p of items){const r=document.createElement('div');r.className='item';const a=document.createElement('strong');a.textContent=p.codigo;const b=document.createElement('span');b.className='tag '+(estado==='pendiente'?'pending':'');b.textContent=estado==='pendiente'?'Pendiente':'Realizado';r.append(a,b);$('list').append(r)}$('pendiente').classList.toggle('active',estado==='pendiente');$('realizado').classList.toggle('active',estado==='realizado')}for(const st of ['pendiente','realizado'])$(st).onclick=()=>{estado=st;render()};$('search').oninput=render;$('mes').onchange=render;fetch('./estados.json?ts='+Date.now(),{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('No se encontró estados.json');return r.json()}).then(d=>{data=d;for(const m of d.meses){const o=document.createElement('option');o.value=m;o.textContent=new Intl.DateTimeFormat('es-CL',{month:'long',year:'numeric',timeZone:'UTC'}).format(new Date(m+'-01T12:00:00Z')).replace(/^./,c=>c.toUpperCase());$('mes').append(o)}$('mes').value=d.meses.includes(new Date().toISOString().slice(0,7))?new Date().toISOString().slice(0,7):d.meses[0];$('updated').textContent='Última publicación: '+new Date(d.actualizado).toLocaleString('es-CL');render()}).catch(e=>$('msg').textContent='No se pudieron cargar los estados: '+e.message)</script></body></html>
